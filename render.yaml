services:
  - type: web
    name: auctionfloor
    runtime: node
    plan: starter
    buildCommand: npm install --include=dev && npm run build
    startCommand: node server.js
    # Persistent disk for listing photos: without it, every redeploy wipes
    # the ephemeral filesystem and all uploaded photos with it. 1 GB holds
    # roughly 2,000 listing photos (~$0.25/month). The app writes uploads
    # to UPLOADS_DIR (server.js creates it on startup).
    disk:
      name: auctionfloor-uploads
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: UPLOADS_DIR
        value: /var/data/uploads
      - key: APP_URL
        value: https://auction423.com
      - key: DATABASE_URL
        fromDatabase:
          name: auctionfloor-db
          property: connectionString
      # Set these by hand in the Render dashboard (they are secrets):
      #   STRIPE_SECRET_KEY  — restricted key on acct_1UYs2oRrelUqumEN,
      #                         Checkout Sessions: Write
      #   STRIPE_WEBHOOK_SECRET — optional, see README
      #   SESSION_SECRET     — long random string (generate one)
      #   SENDGRID_API_KEY / EMAIL_FROM — optional email provider
      #   TWILIO_ACCOUNT_SID / TWILIO_AUTH_TOKEN / TWILIO_FROM — optional SMS

databases:
  - name: auctionfloor-db
    plan: basic-256mb
